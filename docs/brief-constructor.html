<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор данных проекта</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      padding: 0;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      height: 100vh;
      overflow: hidden;
    }
    .left-panel {
      background: white;
      border-right: 2px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .right-panel {
      background: white;
      overflow-y: auto;
      padding: 30px;
    }
    .builder-toolbar {
      padding: 15px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: #f9f9f9;
    }
    .btn-add {
      padding: 8px 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-add:hover { background: #0056b3; }
    .builder-items {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      display: flex;
      flex-direction: column-reverse;
    }
    .builder-item {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 10px;
      overflow: hidden;
      transition: all 0.2s;
      user-select: none;
    }
    .builder-item.collapsed {
      background: #f8f8f8;
    }
    .builder-item-header {
      padding: 12px;
      background: #f9f9f9;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: move;
      user-select: none;
    }
    .builder-item.collapsed .builder-item-header {
      border-bottom: none;
    }
    .builder-item-drag {
      width: 4px;
      height: 20px;
      background: #ccc;
      border-radius: 2px;
      cursor: grab;
    }
    .builder-item-drag:active {
      cursor: grabbing;
    }
    .builder-item-title {
      flex: 1;
      font-weight: 600;
      color: #333;
      font-size: 13px;
    }
    .builder-item-count {
      font-size: 11px;
      color: #999;
      background: #e0e0e0;
      padding: 2px 6px;
      border-radius: 2px;
    }
    .builder-item-collapse {
      width: 20px;
      height: 20px;
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      font-size: 16px;
    }
    .builder-item-delete {
      width: 20px;
      height: 20px;
      background: none;
      border: none;
      cursor: pointer;
      color: #dc3545;
      font-size: 18px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .builder-item-delete:hover { color: #c82333; }
    .builder-item-content {
      padding: 12px;
      display: none;
    }
    .builder-item.expanded .builder-item-content {
      display: block;
    }
    .link-item {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .link-item input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }
    .link-item-add {
      background: #28a745;
      color: white;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .link-item-add:hover { background: #218838; }
    .text-item {
      margin-bottom: 12px;
    }
    .text-item textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
      max-height: 300px;
    }
    .text-item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      font-size: 11px;
      color: #999;
    }
    .text-item-add {
      background: #28a745;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }
    .text-item-add:hover { background: #218838; }
    .image-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 8px;
    }
    .image-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: 2px dashed #ddd;
      border-radius: 4px;
      overflow: hidden;
      background: #f9f9f9;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .image-item:hover {
      border-color: #007bff;
      background: #f0f7ff;
    }
    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-item-add {
      font-size: 24px;
      color: #999;
    }
    .image-item-delete {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(255,0,0,0.8);
      color: white;
      border: none;
      width: 20px;
      height: 20px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      display: none;
    }
    .image-item:hover .image-item-delete {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .editable-title {
      background: none;
      border: none;
      font-weight: 600;
      font-size: 13px;
      color: #333;
      cursor: text;
      padding: 2px 4px;
      margin: -2px -4px;
      border-bottom: 1px solid transparent;
    }
    .editable-title:hover {
      background: #f0f0f0;
      border-bottom-color: #999;
    }
    .editable-title:focus {
      outline: none;
      background: white;
      border-bottom-color: #007bff;
    }
    h1 {
      margin: 0 0 20px 0;
      font-size: 24px;
      color: #333;
    }
    .right-panel h2 {
      margin-top: 0;
      color: #333;
      font-size: 16px;
    }
    textarea::-webkit-scrollbar {
      width: 6px;
    }
    textarea::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }
    textarea::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 3px;
    }
    textarea::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Левая панель: Конструктор -->
    <div class="left-panel">
      <div class="builder-toolbar">
        <button class="btn-add" onclick="addLinksObject()">+ Ссылка</button>
        <button class="btn-add" onclick="addTextObject()">+ Текст</button>
        <button class="btn-add" onclick="addImagesObject()">+ Картинки</button>
      </div>
      <div class="builder-items" id="builderItems"></div>
    </div>

    <!-- Правая панель: Предпросмотр/Форма -->
    <div class="right-panel">
      <h1>Исходная информация</h1>
      <p style="color: #666; margin-bottom: 30px;">Собери все данные о проекте слева, и они появятся здесь для дальнейшей обработки.</p>
      <div id="preview">
        <p style="color: #999; text-align: center; margin-top: 50px;">👈 Добавь данные слева...</p>
      </div>
    </div>
  </div>

  <script>
    let items = [];
    let itemId = 0;

    // Добавить объект со ссылками
    function addLinksObject() {
      const item = {
        id: itemId++,
        type: 'links',
        title: 'Ссылки',
        links: [''],
        expanded: true
      };
      items.unshift(item);
      render();
    }

    // Добавить объект с текстом
    function addTextObject() {
      const item = {
        id: itemId++,
        type: 'text',
        title: 'Текст',
        texts: [''],
        expanded: true
      };
      items.unshift(item);
      render();
    }

    // Добавить объект с картинками
    function addImagesObject() {
      const item = {
        id: itemId++,
        type: 'images',
        title: 'Картинки',
        images: [],
        expanded: true
      };
      items.unshift(item);
      render();
    }

    // Обновить ссылку
    function updateLink(itemId, index, value) {
      const item = items.find(i => i.id === itemId);
      if (item) {
        item.links[index] = value;
        updatePreview();
      }
    }

    // Добавить новую ссылку
    function addLink(itemId) {
      const item = items.find(i => i.id === itemId);
      if (item) {
        item.links.push('');
        render();
      }
    }

    // Удалить ссылку
    function removeLink(itemId, index) {
      const item = items.find(i => i.id === itemId);
      if (item && item.links.length > 1) {
        item.links.splice(index, 1);
        render();
      }
    }

    // Обновить текст
    function updateText(itemId, index, value) {
      const item = items.find(i => i.id === itemId);
      if (item) {
        item.texts[index] = value;
        autoResizeTextarea(event.target);
        updatePreview();
      }
    }

    // Добавить новое текстовое поле
    function addText(itemId) {
      const item = items.find(i => i.id === itemId);
      if (item) {
        item.texts.push('');
        render();
      }
    }

    // Удалить текст
    function removeText(itemId, index) {
      const item = items.find(i => i.id === itemId);
      if (item && item.texts.length > 1) {
        item.texts.splice(index, 1);
        render();
      }
    }

    // Добавить картинку
    function addImage(itemId) {
      const item = items.find(i => i.id === itemId);
      if (item) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => {
          const file = e.target.files[0];
          const reader = new FileReader();
          reader.onload = (event) => {
            item.images.push(event.target.result);
            render();
          };
          reader.readAsDataURL(file);
        };
        input.click();
      }
    }

    // Удалить картинку
    function removeImage(itemId, index) {
      const item = items.find(i => i.id === itemId);
      if (item) {
        item.images.splice(index, 1);
        render();
      }
    }

    // Переключить развернуть/схлопнуть
    function toggleCollapse(itemId) {
      const item = items.find(i => i.id === itemId);
      if (item) {
        item.expanded = !item.expanded;
        render();
      }
    }

    // Удалить объект
    function deleteItem(itemId) {
      items = items.filter(i => i.id !== itemId);
      render();
    }

    // Обновить заголовок
    function updateTitle(itemId, value) {
      const item = items.find(i => i.id === itemId);
      if (item) {
        item.title = value;
        render();
      }
    }

    // Подсчитать символы
    function countChars(text) {
      return text.length;
    }

    // Автоподстройка высоты textarea
    function autoResizeTextarea(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    // Получить количество сущностей
    function getItemCount(item) {
      if (item.type === 'links') return item.links.filter(l => l.trim()).length;
      if (item.type === 'text') return item.texts.filter(t => t.trim()).length;
      if (item.type === 'images') return item.images.length;
      return 0;
    }

    // Отрендерить интерфейс
    function render() {
      const builderItems = document.getElementById('builderItems');
      builderItems.innerHTML = items.map(item => `
        <div class="builder-item ${item.expanded ? 'expanded' : 'collapsed'}">
          <div class="builder-item-header">
            <div class="builder-item-drag"></div>
            <input
              type="text"
              class="editable-title"
              value="${item.title}"
              onchange="updateTitle(${item.id}, this.value)"
              onclick="event.stopPropagation()"
            />
            ${getItemCount(item) > 0 ? `<div class="builder-item-count">${getItemCount(item)}</div>` : ''}
            <button class="builder-item-collapse" onclick="toggleCollapse(${item.id})">
              ${item.expanded ? '▼' : '▶'}
            </button>
            <button class="builder-item-delete" onclick="deleteItem(${item.id})">✕</button>
          </div>
          <div class="builder-item-content">
            ${renderItemContent(item)}
          </div>
        </div>
      `).join('');
    }

    // Отрендерить содержимое объекта
    function renderItemContent(item) {
      if (item.type === 'links') {
        return `
          <div>
            ${item.links.map((link, idx) => `
              <div class="link-item">
                <input
                  type="url"
                  placeholder="https://..."
                  value="${link}"
                  onchange="updateLink(${item.id}, ${idx}, this.value)"
                />
                <button class="link-item-add" onclick="addLink(${item.id})">+</button>
              </div>
            `).join('')}
          </div>
        `;
      }
      if (item.type === 'text') {
        return `
          <div>
            ${item.texts.map((text, idx) => `
              <div class="text-item">
                <textarea
                  placeholder="Введи текст..."
                  onchange="updateText(${item.id}, ${idx}, this.value)"
                  onkeyup="autoResizeTextarea(this)"
                >${text}</textarea>
                <div class="text-item-meta">
                  <span>${countChars(text)} символов</span>
                  ${item.texts.length > 1 ? `<button class="text-item-add" onclick="removeText(${item.id}, ${idx})">Удалить</button>` : ''}
                </div>
              </div>
            `).join('')}
            <button class="text-item-add" onclick="addText(${item.id})">+ Добавить поле</button>
          </div>
        `;
      }
      if (item.type === 'images') {
        return `
          <div class="image-gallery">
            ${item.images.map((img, idx) => `
              <div class="image-item">
                <img src="${img}" />
                <button class="image-item-delete" onclick="removeImage(${item.id}, ${idx})">✕</button>
              </div>
            `).join('')}
            <div class="image-item" onclick="addImage(${item.id})">
              <div class="image-item-add">+</div>
            </div>
          </div>
        `;
      }
    }

    // Обновить предпросмотр
    function updatePreview() {
      const preview = document.getElementById('preview');
      if (items.length === 0) {
        preview.innerHTML = '<p style="color: #999; text-align: center; margin-top: 50px;">👈 Добавь данные слева...</p>';
        return;
      }

      let html = '<div>';
      for (const item of items) {
        if (item.type === 'links' && item.links.some(l => l.trim())) {
          html += `<h2>${item.title}</h2><ul>`;
          item.links.forEach(link => {
            if (link.trim()) {
              html += `<li><a href="${link}" target="_blank">${link}</a></li>`;
            }
          });
          html += '</ul>';
        }
        if (item.type === 'text' && item.texts.some(t => t.trim())) {
          html += `<h2>${item.title}</h2>`;
          item.texts.forEach(text => {
            if (text.trim()) {
              html += `<p>${text.replace(/\n/g, '<br>')}</p>`;
            }
          });
        }
        if (item.type === 'images' && item.images.length > 0) {
          html += `<h2>${item.title}</h2><div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">`;
          item.images.forEach(img => {
            html += `<img src="${img}" style="width: 100%; border-radius: 4px;" />`;
          });
          html += '</div>';
        }
      }
      html += '</div>';
      preview.innerHTML = html;
    }

    // Инициализация
    render();
  </script>
</body>
</html>
