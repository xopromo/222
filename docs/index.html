<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK Ads Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #5b8cff;
    --accent-hover: #7aa3ff;
    --text: #e2e6f3;
    --text-dim: #8892b0;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --radius: 8px;
    --sidebar: 220px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* TOP BAR */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar h1 { font-size: 16px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .topbar-sep { flex: 1; }
  .topbar label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .topbar input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 5px 10px;
    font-size: 13px;
    outline: none;
    width: 220px;
  }
  .topbar input:focus { border-color: var(--accent); }
  #api-url { width: 280px; }
  .btn {
    padding: 6px 14px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }
  .btn-sm { padding: 3px 8px; font-size: 12px; }

  /* LAYOUT */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: var(--sidebar);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .sidebar-section {
    padding: 12px 8px 4px;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: var(--radius);
    margin: 1px 4px;
    font-size: 13px;
    color: var(--text-dim);
    transition: all 0.1s;
    border: 1px solid transparent;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--surface2); color: var(--accent); border-color: var(--border); }
  .nav-icon { font-size: 15px; width: 18px; text-align: center; }

  /* MAIN */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* PANEL */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .panel-title { font-size: 14px; font-weight: 600; flex: 1; }
  .panel-body { padding: 16px; }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    padding: 8px 12px;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .clickable-row { cursor: pointer; }

  /* BADGES */
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-green { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge-red { background: rgba(248,113,113,0.15); color: var(--red); }
  .badge-yellow { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .badge-blue { background: rgba(91,140,255,0.15); color: var(--accent); }
  .badge-gray { background: rgba(136,146,176,0.15); color: var(--text-dim); }

  /* FORM */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-label { font-size: 12px; color: var(--text-dim); font-weight: 500; }
  .form-input, .form-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  .form-input:focus, .form-select:focus { border-color: var(--accent); }
  .form-select option { background: var(--surface2); }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  /* STATS GRID */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .stat-value { font-size: 22px; font-weight: 700; }

  /* EMPTY / LOADING */
  .empty { text-align: center; padding: 40px; color: var(--text-dim); font-size: 13px; }
  .loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 40px; color: var(--text-dim); font-size: 13px; }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  #toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    max-width: 320px;
    animation: fadeIn 0.2s ease;
    border: 1px solid;
  }
  .toast-success { background: rgba(74,222,128,0.1); border-color: var(--green); color: var(--green); }
  .toast-error { background: rgba(248,113,113,0.1); border-color: var(--red); color: var(--red); }
  .toast-info { background: rgba(91,140,255,0.1); border-color: var(--accent); color: var(--accent); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 480px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 15px; font-weight: 600; flex: 1; }
  .modal-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 20px; line-height: 1; }
  .modal-body { padding: 20px; }

  /* BREADCRUMB */
  .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .breadcrumb span { color: var(--text); }
  .breadcrumb .sep { color: var(--border); }
  .breadcrumb a { color: var(--accent); cursor: pointer; }
  .breadcrumb a:hover { text-decoration: underline; }

  /* DATE FILTER */
  .date-filter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .date-filter label { font-size: 12px; color: var(--text-dim); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <h1>VK Ads</h1>
  <label for="api-url">API:</label>
  <input type="text" id="api-url" placeholder="http://localhost:8000" value="http://localhost:8000">
  <label for="vk-token">Токен:</label>
  <input type="password" id="vk-token" placeholder="vk1.a.xxx...">
  <button class="btn btn-primary" onclick="App.connect()">Подключить</button>
</div>

<!-- LAYOUT -->
<div class="layout">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">Обзор</div>
    <div class="nav-item active" data-view="accounts" onclick="App.navigate('accounts')">
      <span class="nav-icon">🏦</span> Кабинеты
    </div>
    <div class="nav-item" data-view="campaigns" onclick="App.navigate('campaigns')">
      <span class="nav-icon">📣</span> Кампании
    </div>
    <div class="nav-item" data-view="ads" onclick="App.navigate('ads')">
      <span class="nav-icon">🎯</span> Объявления
    </div>
    <div class="nav-item" data-view="stats" onclick="App.navigate('stats')">
      <span class="nav-icon">📊</span> Статистика
    </div>
    <div class="sidebar-section">Аудитория</div>
    <div class="nav-item" data-view="retargeting" onclick="App.navigate('retargeting')">
      <span class="nav-icon">🔁</span> Ретаргетинг
    </div>
    <div class="sidebar-section">Контент</div>
    <div class="nav-item" data-view="wall" onclick="App.navigate('wall')">
      <span class="nav-icon">📝</span> Стена
    </div>
    <div class="nav-item" data-view="groups" onclick="App.navigate('groups')">
      <span class="nav-icon">👥</span> Группы
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main" id="main-content">
    <div class="panel">
      <div class="panel-body">
        <div class="empty">Введите API URL и VK токен, затем нажмите <strong>Подключить</strong></div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)App.closeModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Форма</span>
      <button class="modal-close" onclick="App.closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- TOASTS -->
<div id="toast-container"></div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
const State = {
  apiUrl: 'http://localhost:8000',
  token: '',
  accounts: [],
  selectedAccount: null,
  campaigns: [],
  selectedCampaign: null,
  ads: [],
  currentView: 'accounts',
};

// ─── API ──────────────────────────────────────────────────────────────────────
const api = {
  async req(method, path, body = null, params = {}) {
    const url = new URL(State.apiUrl + path);
    Object.entries(params).forEach(([k, v]) => { if (v !== null && v !== undefined && v !== '') url.searchParams.set(k, v); });
    const opts = {
      method,
      headers: { 'X-Vk-Token': State.token, 'Accept': 'application/json' },
    };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const res = await fetch(url, opts);
    const data = await res.json().catch(() => ({ detail: res.statusText }));
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    return data;
  },
  get: (p, params) => api.req('GET', p, null, params),
  post: (p, b, params) => api.req('POST', p, b, params),
  patch: (p, b) => api.req('PATCH', p, b),
  delete: (p, params) => api.req('DELETE', p, null, params),
};

// ─── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ─── RENDER HELPERS ───────────────────────────────────────────────────────────
function loading() {
  return `<div class="loading"><div class="spinner"></div> Загрузка...</div>`;
}
function empty(msg = 'Нет данных') {
  return `<div class="empty">${msg}</div>`;
}
function statusBadge(status) {
  const map = { 0: ['badge-red', 'Остановлен'], 1: ['badge-green', 'Активен'], 2: ['badge-gray', 'Удалён'] };
  const [cls, label] = map[status] ?? ['badge-gray', status];
  return `<span class="badge ${cls}">${label}</span>`;
}
function fmtNum(v) { return v != null ? Number(v).toLocaleString('ru') : '—'; }
function fmtMoney(v) { return v != null ? Number(v).toLocaleString('ru', { style: 'currency', currency: 'RUB', maximumFractionDigits: 2 }) : '—'; }

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
const App = {
  async connect() {
    State.apiUrl = document.getElementById('api-url').value.replace(/\/$/, '');
    State.token = document.getElementById('vk-token').value.trim();
    if (!State.token) { toast('Введите VK токен', 'error'); return; }
    // save to localStorage
    localStorage.setItem('vk_api_url', State.apiUrl);
    localStorage.setItem('vk_token', State.token);
    await this.navigate('accounts');
  },

  navigate(view) {
    State.currentView = view;
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.view === view);
    });
    const views = { accounts: Views.accounts, campaigns: Views.campaigns, ads: Views.ads, stats: Views.stats, retargeting: Views.retargeting, wall: Views.wall, groups: Views.groups };
    if (views[view]) views[view]();
    else render(`<div class="empty">Раздел в разработке</div>`);
  },

  openModal(title, bodyHtml) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHtml;
    document.getElementById('modal-overlay').classList.add('open');
  },

  closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  },
};

function render(html) {
  document.getElementById('main-content').innerHTML = html;
}

// ─── VIEWS ────────────────────────────────────────────────────────────────────
const Views = {

  // ── ACCOUNTS ──────────────────────────────────────────────────────────────
  async accounts() {
    render(`<div class="panel"><div class="panel-header"><span class="panel-title">Рекламные кабинеты</span></div><div class="panel-body">${loading()}</div></div>`);
    try {
      const data = await api.get('/api/v1/accounts/');
      State.accounts = data.response ?? data ?? [];
      const rows = State.accounts.map(a => `
        <tr class="clickable-row" onclick="App._selectAccount(${a.account_id})">
          <td><strong>${a.account_id}</strong></td>
          <td>${a.account_name ?? '—'}</td>
          <td><span class="badge badge-blue">${a.account_type ?? '—'}</span></td>
          <td>${statusBadge(a.account_status)}</td>
          <td>${a.access_role ?? '—'}</td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();Views._accountBudget(${a.account_id})">Бюджет</button>
            <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();App._goToCampaigns(${a.account_id})">Кампании →</button>
          </td>
        </tr>`).join('');
      render(`
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">Рекламные кабинеты (${State.accounts.length})</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>ID</th><th>Название</th><th>Тип</th><th>Статус</th><th>Роль</th><th>Действия</th></tr></thead>
              <tbody>${rows || `<tr><td colspan="6">${empty()}</td></tr>`}</tbody>
            </table>
          </div>
        </div>`);
    } catch(e) { render(`<div class="panel"><div class="panel-body"><div class="empty">Ошибка: ${e.message}</div></div></div>`); toast(e.message, 'error'); }
  },

  async _accountBudget(accountId) {
    try {
      const d = await api.get(`/api/v1/accounts/${accountId}/budget`);
      const budget = d.response ?? d.budget ?? JSON.stringify(d);
      toast(`Бюджет кабинета ${accountId}: ${fmtMoney(budget)}`, 'info');
    } catch(e) { toast(e.message, 'error'); }
  },

  // ── CAMPAIGNS ─────────────────────────────────────────────────────────────
  async campaigns(accountId) {
    if (accountId) State.selectedAccount = accountId;
    if (!State.selectedAccount && State.accounts.length > 0) State.selectedAccount = State.accounts[0].account_id;
    if (!State.selectedAccount) {
      render(`<div class="panel"><div class="panel-body">${empty('Сначала выберите рекламный кабинет')}</div></div>`);
      return;
    }
    const accId = State.selectedAccount;
    const accName = State.accounts.find(a => a.account_id === accId)?.account_name ?? accId;
    render(`
      <div class="breadcrumb"><a onclick="App.navigate('accounts')">Кабинеты</a><span class="sep">›</span><span>${accName}</span></div>
      <div class="panel"><div class="panel-header"><span class="panel-title">Кампании</span></div><div class="panel-body">${loading()}</div></div>`);
    try {
      const data = await api.get(`/api/v1/accounts/${accId}/campaigns/`);
      State.campaigns = data.response ?? data ?? [];
      const rows = State.campaigns.map(c => `
        <tr class="clickable-row" onclick="App._goToAds(${c.id})">
          <td><strong>${c.id}</strong></td>
          <td>${c.name ?? '—'}</td>
          <td><span class="badge badge-blue">${c.type ?? '—'}</span></td>
          <td>${statusBadge(c.status)}</td>
          <td>${fmtMoney(c.day_limit)}</td>
          <td>${fmtMoney(c.lifetime_limit)}</td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();Views._editCampaign(${c.id})">Изменить</button>
            <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();Views._deleteCampaign(${accId},${c.id})">Удалить</button>
          </td>
        </tr>`).join('');
      render(`
        <div class="breadcrumb"><a onclick="App.navigate('accounts')">Кабинеты</a><span class="sep">›</span><span>${accName}</span></div>
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">Кампании (${State.campaigns.length})</span>
            <button class="btn btn-primary btn-sm" onclick="Views._createCampaign(${accId})">+ Создать</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>ID</th><th>Название</th><th>Тип</th><th>Статус</th><th>Дн. лимит</th><th>Общий лимит</th><th>Действия</th></tr></thead>
              <tbody>${rows || `<tr><td colspan="7">${empty()}</td></tr>`}</tbody>
            </table>
          </div>
        </div>`);
    } catch(e) { render(`<div class="panel"><div class="panel-body"><div class="empty">Ошибка: ${e.message}</div></div></div>`); toast(e.message, 'error'); }
  },

  _createCampaign(accId) {
    App.openModal('Создать кампанию', `
      <div class="form-grid">
        <div class="form-group full"><label class="form-label">Название *</label><input class="form-input" id="fc-name" placeholder="Моя кампания"></div>
        <div class="form-group"><label class="form-label">Тип</label>
          <select class="form-select" id="fc-type">
            <option value="normal">Обычная</option>
            <option value="mobile_apps">Мобильные приложения</option>
            <option value="promoted_posts">Продвижение записей</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Дневной лимит (руб.)</label><input class="form-input" id="fc-day" type="number" value="0"></div>
        <div class="form-group"><label class="form-label">Общий лимит (руб.)</label><input class="form-input" id="fc-life" type="number" value="0"></div>
        <div class="form-actions full">
          <button class="btn btn-secondary" onclick="App.closeModal()">Отмена</button>
          <button class="btn btn-primary" onclick="Views._submitCreateCampaign(${accId})">Создать</button>
        </div>
      </div>`);
  },

  async _submitCreateCampaign(accId) {
    const name = document.getElementById('fc-name').value.trim();
    if (!name) { toast('Введите название', 'error'); return; }
    try {
      await api.post(`/api/v1/accounts/${accId}/campaigns/`, {
        name,
        type: document.getElementById('fc-type').value,
        day_limit: String(document.getElementById('fc-day').value || 0),
        lifetime_limit: String(document.getElementById('fc-life').value || 0),
      });
      App.closeModal(); toast('Кампания создана', 'success');
      Views.campaigns(accId);
    } catch(e) { toast(e.message, 'error'); }
  },

      </div>`,
      id: `<div class="form-grid">
        <div class="form-group full"><label class="form-label">ID или короткие имена (через запятую)</label><input class="form-input" id="g-ids" placeholder="1,vkteam,club2"></div>
        <div class="form-actions full"><button class="btn btn-primary" onclick="Views._loadGroupsById()">Загрузить</button></div>
      </div>`,
    };
    document.getElementById('groups-form').innerHTML = forms[tab] ?? '';
  },

  async _loadMyGroups() {
    document.getElementById('groups-result').innerHTML = `<div class="panel"><div class="panel-body">${loading()}</div></div>`;
    const uid = document.getElementById('g-uid').value.trim();
    const filter = document.getElementById('g-filter').value;
    try {
      const data = await api.get('/api/v1/groups/my', { user_id: uid || undefined, extended: true, filter: filter || undefined });
      Views._renderGroups(data.response?.items ?? data.items ?? data ?? []);
    } catch(e) { document.getElementById('groups-result').innerHTML = `<div class="panel"><div class="panel-body"><div class="empty">Ошибка: ${e.message}</div></div></div>`; toast(e.message, 'error'); }
  },

  async _searchGroups() {
    const q = document.getElementById('g-q').value.trim();
    if (!q) { toast('Введите запрос', 'error'); return; }
    const count = document.getElementById('g-count').value;
    document.getElementById('groups-result').innerHTML = `<div class="panel"><div class="panel-body">${loading()}</div></div>`;
    try {
      const data = await api.get('/api/v1/groups/search', { q, count });
      Views._renderGroups(data.response?.items ?? data.items ?? data ?? []);
    } catch(e) { document.getElementById('groups-result').innerHTML = `<div class="panel"><div class="panel-body"><div class="empty">Ошибка: ${e.message}</div></div></div>`; toast(e.message, 'error'); }
  },

  async _loadGroupsById() {
    const ids = document.getElementById('g-ids').value.trim();
    if (!ids) { toast('Введите ID', 'error'); return; }
    document.getElementById('groups-result').innerHTML = `<div class="panel"><div class="panel-body">${loading()}</div></div>`;
    try {
      const data = await api.get('/api/v1/groups/', { group_ids: ids });
      Views._renderGroups(data.response ?? data ?? []);
    } catch(e) { document.getElementById('groups-result').innerHTML = `<div class="panel"><div class="panel-body"><div class="empty">Ошибка: ${e.message}</div></div></div>`; toast(e.message, 'error'); }
  },

  _renderGroups(groups) {
    const rows = groups.map(g => `
      <tr>
        <td>${g.id}</td>
        <td>${g.screen_name ? `<a href="https://vk.com/${g.screen_name}" target="_blank" style="color:var(--accent)">@${g.screen_name}</a>` : '—'}</td>
        <td>${g.name ?? '—'}</td>
        <td><span class="badge badge-blue">${g.type ?? '—'}</span></td>
        <td>${g.is_closed != null ? (g.is_closed ? '<span class="badge badge-gray">Закрытая</span>' : '<span class="badge badge-green">Открытая</span>') : '—'}</td>
        <td>${fmtNum(g.members_count)}</td>
      </tr>`).join('');
    document.getElementById('groups-result').innerHTML = `
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Группы (${groups.length})</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Адрес</th><th>Название</th><th>Тип</th><th>Тип доступа</th><th>Участников</th></tr></thead>
            <tbody>${rows || `<tr><td colspan="6">${empty()}</td></tr>`}</tbody>
          </table>
        </div>
      </div>`;
  },
};

// ─── NAVIGATION HELPERS ───────────────────────────────────────────────────────
App._selectAccount = function(accId) {
  State.selectedAccount = accId;
  App._goToCampaigns(accId);
};

App._goToCampaigns = function(accId) {
  State.selectedAccount = accId;
  State.selectedCampaign = null;
  App.navigate('campaigns');
};

App._goToAds = function(campaignId) {
  State.selectedCampaign = campaignId;
  App.navigate('ads');
};

// ─── INIT ─────────────────────────────────────────────────────────────────────
(function init() {
  const savedUrl = localStorage.getItem('vk_api_url');
  const savedToken = localStorage.getItem('vk_token');
  if (savedUrl) { document.getElementById('api-url').value = savedUrl; State.apiUrl = savedUrl; }
  if (savedToken) { document.getElementById('vk-token').value = savedToken; State.token = savedToken; }
})();
</script>
</body>
</html>
