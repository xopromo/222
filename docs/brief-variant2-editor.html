<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вариант 2: Редактор с превью</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      padding: 20px;
      margin: 0;
      background: #f5f5f5;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { color: #333; margin-bottom: 10px; }
    .description { color: #666; margin-bottom: 30px; }
    .editor-layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
    }
    .panel {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    .panel h2 { margin-top: 0; color: #333; font-size: 16px; }
    .document-preview {
      background: white;
      padding: 12px;
      border-radius: 6px;
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.7;
      color: #333;
      font-family: 'Monaco', 'Menlo', monospace;
      border: 2px solid #ddd;
      resize: vertical;
      width: 100%;
      margin: 0;
      box-sizing: border-box;
      min-height: 300px;
    }
    .form-fields {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 6px;
      overflow: hidden;
    }
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
      font-size: 13px;
    }
    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      flex: 1;
    }
    .field-with-confidence {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }
    .field-with-confidence .confidence {
      flex-shrink: 0;
    }
    .google-doc-section {
      margin-bottom: 15px;
      flex-shrink: 0;
    }
    .google-doc-section label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 13px;
    }
    .google-doc-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .google-doc-input-group input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }
    .add-doc-btn {
      padding: 8px 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .add-doc-btn:hover { background: #218838; }
    .docs-list {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    .docs-list span {
      display: block;
      padding: 4px 0;
    }
    .field input:focus, .field select:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0,123,255,0.1);
    }
    .confidence {
      font-size: 11px;
      margin-top: 4px;
      padding: 4px 8px;
      border-radius: 3px;
      display: inline-block;
    }
    .confidence.high {
      background: #d4edda;
      color: #155724;
    }
    .confidence.medium {
      background: #fff3cd;
      color: #856404;
    }
    .confidence.low {
      background: #f8d7da;
      color: #721c24;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .date-range { display: flex; gap: 8px; align-items: center; }
    .date-range input { flex: 1; }
    .date-range span { color: #666; font-size: 12px; }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #6c757d;
      color: white;
      flex: 1;
    }
    .btn-primary:hover { background: #5a6268; }
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    .btn-secondary:hover { background: #5a6268; }
    .btn-success {
      background: #28a745;
      color: white;
      grid-column: 1 / -1;
      padding: 12px;
      font-size: 14px;
    }
    .btn-success:hover { background: #218838; }
    @media (max-width: 1000px) {
      .editor-layout { grid-template-columns: 1fr; }
      .document-preview { max-height: 300px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Исходная информация</h1>

    <div class="editor-layout">
      <!-- Левая часть: Исходный документ -->
      <div class="panel">
        <h2>📄 Бриф</h2>

        <div class="google-doc-section">
          <label>Ссылка на Google Doc (опционально)</label>
          <div class="google-doc-input-group">
            <input type="url" id="googleDocUrl" placeholder="https://docs.google.com/document/d/..." />
            <button class="add-doc-btn" onclick="addGoogleDoc()">+ Добавить</button>
          </div>
          <div class="docs-list" id="docsList"></div>
        </div>

        <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 13px;">Или отредактируй текст</label>
        <textarea id="briefText" class="document-preview" placeholder="Вставь текст брифа или скопируй из Google Docs...">Бриф: Летняя акция
========================

📌 ОСНОВНЫЕ ПАРАМЕТРЫ
Название кампании: Летняя акция
Бюджет: 50 000 рублей
Период проведения: 1 июня - 30 июня 2024
Цель: увеличить продажи на 30%

👥 ЦЕЛЕВАЯ АУДИТОРИЯ
Возраст: от 18 до 45 лет
Пол: мужчины и женщины
Регионы: Москва, Санкт-Петербург, Казань
Интересы: шоппинг, мода, скидки

🎨 КРЕАТИВЫ И МЕССЕЙДЖИНГ
Основной слоган: "Летние скидки до 50%"
Призыв к действию: "Купить сейчас"
Форматы: 1200x628, 1080x1080
Видео: 15-30 секунд</textarea>
      </div>

      <!-- Правая часть: Структурированная форма -->
      <div class="panel">
        <h2>✓ Извлеченные данные</h2>
        <div class="form-fields">
          <div class="field">
            <label>Название кампании</label>
            <div class="field-with-confidence">
              <input type="text" value="Летняя акция" />
              <div class="confidence high">98%</div>
            </div>
          </div>

          <div class="field">
            <label>Бюджет (₽)</label>
            <div class="field-with-confidence">
              <input type="number" value="50000" />
              <div class="confidence high">99%</div>
            </div>
          </div>

          <div class="field">
            <label>Период</label>
            <div class="field-with-confidence">
              <div class="date-range">
                <input type="date" value="2024-06-01" />
                <span>—</span>
                <input type="date" value="2024-06-30" />
              </div>
              <div class="confidence high">100%</div>
            </div>
          </div>

          <div class="field">
            <label>Возраст целевой аудитории</label>
            <div class="field-with-confidence">
              <div style="display: flex; gap: 5px; align-items: center;">
                От <input type="number" value="18" style="width: 50px;" />
                до <input type="number" value="45" style="width: 50px;" /> лет
              </div>
              <div class="confidence high">99%</div>
            </div>
          </div>

          <div class="field">
            <label>Основное сообщение / Слоган</label>
            <div class="field-with-confidence">
              <input type="text" value="Летние скидки до 50%" />
              <div class="confidence medium">85%</div>
            </div>
          </div>

          <div class="field">
            <label>CTA (призыв к действию)</label>
            <div class="field-with-confidence">
              <input type="text" value="Купить сейчас" />
              <div class="confidence high">92%</div>
            </div>
          </div>

          <div class="action-buttons">
            <button class="btn-primary" onclick="reExtractData()">🔄 Переизвлечь данные</button>
            <button class="btn-success" onclick="proceedToNext()">Далее →</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const briefTextarea = document.getElementById('briefText');
    const googleDocUrl = document.getElementById('googleDocUrl');
    const docsList = document.getElementById('docsList');
    let addedDocs = [];

    // Загрузить сохраненные данные при загрузке страницы
    window.addEventListener('load', () => {
      const savedText = localStorage.getItem('briefText');
      if (savedText) {
        briefTextarea.value = savedText;
      }
      const savedDocs = localStorage.getItem('addedDocs');
      if (savedDocs) {
        addedDocs = JSON.parse(savedDocs);
        renderDocsList();
      }
    });

    // Сохранять текст автоматически при изменении
    briefTextarea.addEventListener('input', () => {
      localStorage.setItem('briefText', briefTextarea.value);
    });

    // Добавить Google Doc
    function addGoogleDoc() {
      const url = googleDocUrl.value.trim();
      if (!url) {
        alert('Введи URL документа');
        return;
      }
      if (!url.includes('docs.google.com')) {
        alert('Это не похоже на ссылку Google Docs');
        return;
      }

      const docName = extractDocName(url);
      if (!addedDocs.find(d => d.url === url)) {
        addedDocs.push({ url, name: docName });
        localStorage.setItem('addedDocs', JSON.stringify(addedDocs));
        googleDocUrl.value = '';
        renderDocsList();
      } else {
        alert('Этот документ уже добавлен');
      }
    }

    function extractDocName(url) {
      const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1].substring(0, 12) + '...' : 'Document';
    }

    function renderDocsList() {
      if (addedDocs.length === 0) {
        docsList.innerHTML = '';
        return;
      }
      docsList.innerHTML = addedDocs.map((doc, i) =>
        `<span>✓ ${doc.name} <button onclick="removeDoc(${i})" style="background:none;border:none;color:#dc3545;cursor:pointer;font-size:12px;">✕</button></span>`
      ).join('');
    }

    function removeDoc(index) {
      addedDocs.splice(index, 1);
      localStorage.setItem('addedDocs', JSON.stringify(addedDocs));
      renderDocsList();
    }

    // Функция переизвлечения данных через Mistral API (напрямую)
    async function reExtractData() {
      const briefText = briefTextarea.value.trim();
      if (!briefText) {
        alert('Введи текст брифа!');
        return;
      }

      // Проверяем ключ
      const apiKey = localStorage.getItem('mistral_api_key');
      if (!apiKey) {
        const key = prompt('Введи Mistral API ключ (сохранится локально):');
        if (!key) return;
        localStorage.setItem('mistral_api_key', key);
      }

      // Отключаем кнопку и показываем загрузку
      const btn = event.target;
      const originalText = btn.textContent;
      btn.textContent = '⏳ Обработка...';
      btn.disabled = true;

      try {
        const prompt = `Analyze the following brief text and extract the following information.
Return ONLY valid JSON, no markdown code blocks.

Brief text:
---
${briefText}
---

Extract and return this JSON structure (use null for missing fields):
{
  "campaign_name": {"value": "...", "confidence": 0.95},
  "budget_rub": {"value": 50000, "confidence": 0.95},
  "start_date": {"value": "2024-06-01", "confidence": 0.95},
  "end_date": {"value": "2024-06-30", "confidence": 0.95},
  "age_from": {"value": 18, "confidence": 0.95},
  "age_to": {"value": 45, "confidence": 0.95},
  "message": {"value": "...", "confidence": 0.85},
  "cta": {"value": "...", "confidence": 0.90}
}

Guidelines:
- confidence is 0-100 (as decimal, e.g., 0.95 = 95%)
- Extract dates in YYYY-MM-DD format
- Numbers without currency notation
- Be conservative with confidence (lower if uncertain)
- Return ONLY the JSON object, no extra text`;

        const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('mistral_api_key')}`
          },
          body: JSON.stringify({
            model: 'mistral-small-latest',
            messages: [{ role: 'user', content: prompt }],
            temperature: 0.1
          })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || 'Ошибка API Mistral');
        }

        const result = await response.json();
        const responseText = result.choices[0].message.content.trim();

        // Парсим JSON
        const data = JSON.parse(responseText);

        // Обновляем поля с извлеченными данными
        updateFieldsFromExtraction(data);
        alert('✓ Данные успешно переизвлечены!');

      } catch (error) {
        alert(`❌ Ошибка: ${error.message}`);
        console.error('Extraction error:', error);
      } finally {
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    // Обновить поля формы с извлеченными данными
    function updateFieldsFromExtraction(data) {
      // Обновляем "Название кампании"
      if (data.campaign_name?.value) {
        document.querySelectorAll('.field')[0].querySelector('input').value = data.campaign_name.value;
        updateBadge(0, data.campaign_name.confidence);
      }

      // Обновляем "Бюджет"
      if (data.budget_rub?.value) {
        document.querySelectorAll('.field')[1].querySelector('input').value = data.budget_rub.value;
        updateBadge(1, data.budget_rub.confidence);
      }

      // Обновляем "Период"
      if (data.start_date?.value) {
        const dateInputs = document.querySelectorAll('.field')[2].querySelectorAll('input');
        dateInputs[0].value = data.start_date.value;
        updateBadge(2, data.start_date.confidence);
      }
      if (data.end_date?.value) {
        const dateInputs = document.querySelectorAll('.field')[2].querySelectorAll('input');
        dateInputs[1].value = data.end_date.value;
      }

      // Обновляем "Возраст"
      if (data.age_from?.value || data.age_to?.value) {
        const ageInputs = document.querySelectorAll('.field')[3].querySelectorAll('input');
        if (data.age_from?.value) ageInputs[0].value = data.age_from.value;
        if (data.age_to?.value) ageInputs[1].value = data.age_to.value;
        updateBadge(3, data.age_from?.confidence || 0.8);
      }

      // Обновляем "Слоган"
      if (data.message?.value) {
        document.querySelectorAll('.field')[4].querySelector('input').value = data.message.value;
        updateBadge(4, data.message.confidence);
      }

      // Обновляем "CTA"
      if (data.cta?.value) {
        document.querySelectorAll('.field')[5].querySelector('input').value = data.cta.value;
        updateBadge(5, data.cta.confidence);
      }
    }

    // Обновить badge с процентом уверенности
    function updateBadge(fieldIndex, confidence) {
      const badge = document.querySelectorAll('.field')[fieldIndex]?.querySelector('.confidence');
      if (badge) {
        const percent = Math.round(confidence * 100);
        badge.textContent = percent + '%';
        badge.className = 'confidence ' + (percent >= 85 ? 'high' : percent >= 70 ? 'medium' : 'low');
      }
    }

    // Функция перехода на следующий экран
    function proceedToNext() {
      alert('✓ Переход на экран с генерацией заголовков и компоновкой креативов...');
    }
  </script>
</body>
</html>
